name: iOS Build (Swift Package)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build for iOS (arm64)
        run: swift build -c release --triple arm64-apple-ios
      - name: Build for iOS Simulator
        run: swift build -c release --triple arm64-apple-ios-simulator
