<!doctype html>
<html lang="th"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
<title>Diamond HUD • CEF SA-MP</title><link rel="stylesheet" href="hud.css"/></head>
<body>
<!-- All graphics are individual PNG assets. No text is baked into the sprites. -->
<main id="hud" role="status" aria-label="Diamond player HUD">
    <img class="asset" src="img/00_main_shell.png" style="left:47px;top:186px;width:1450px;height:216px" alt=""/>
    <img class="asset" src="img/01_left_chevron.png" style="left:52px;top:195px;width:158px;height:171px" alt=""/>
    <img id="player-avatar" class="player-avatar" alt="" referrerpolicy="no-referrer" hidden/>
    <img class="asset" src="img/02_player_plate.png" style="left:178px;top:120px;width:546px;height:80px" alt=""/>
    <img class="asset" src="img/03_voice_plate.png" style="left:674px;top:120px;width:294px;height:80px" alt=""/>
    <img class="asset" src="img/04_datetime_plate.png" style="left:931px;top:54px;width:563px;height:151px" alt=""/>
    <img class="asset" src="img/05_online_plate.png" style="left:1129px;top:120px;width:344px;height:70px" alt=""/>
    <img class="asset money-asset" src="img/21_money_chip.png" style="left:944px;top:127px;width:190px;height:55px" alt=""/>
    <img class="asset" src="img/06_health_track.png" style="left:279px;top:217px;width:866px;height:70px" alt=""/>
    <div id="clip-health" class="fill-clip" style="left:303px;top:231px;width:813px;height:51px"><img src="img/07_health_fill.png" style="width:813px;height:51px" alt="" /></div>
    <img class="asset" src="img/08_armour_track.png" style="left:279px;top:299px;width:803px;height:65px" alt=""/>
    <div id="clip-armour" class="fill-clip" style="left:302px;top:309px;width:754px;height:44px"><img src="img/09_armour_fill.png" style="width:754px;height:44px" alt="" /></div>
    <img class="asset" src="img/17_food_triangle.png" style="left:1112px;top:217px;width:196px;height:147px" alt=""/>
    <img class="asset" src="img/19_water_triangle.png" style="left:1279px;top:215px;width:196px;height:147px" alt=""/>
    <img class="asset" src="img/10_heart_icon.png" style="left:226px;top:223px;width:76px;height:74px" alt=""/>
    <img class="asset" src="img/11_shield_icon.png" style="left:224px;top:292px;width:77px;height:78px" alt=""/>
    <img class="asset" src="img/12_microphone.png" style="left:741px;top:138px;width:54px;height:58px" alt=""/>
    <img class="asset waveform" src="img/13_waveform.png" style="left:793px;top:140px;width:104px;height:43px" alt=""/>
    <img class="asset" src="img/14_calendar.png" style="left:1000px;top:72px;width:45px;height:46px" alt=""/>
    <img class="asset" src="img/15_clock.png" style="left:1277px;top:71px;width:49px;height:49px" alt=""/>
    <img class="asset" src="img/16_players.png" style="left:1178px;top:134px;width:55px;height:45px" alt=""/>
    <img id="burger-icon" class="asset dynamic-icon" src="img/18_burger_icon.png" style="left:1170px;top:264px;width:78px;height:75px" alt=""/>
    <img id="water-icon" class="asset dynamic-icon" src="img/20_droplet_icon.png" style="left:1342px;top:240px;width:71px;height:91px" alt=""/>
    <img class="asset" src="img/22_small_divider.png" style="left:1263px;top:77px;width:5px;height:40px" alt=""/>
    <div class="label id-label">ID : <span id="player-id">1024</span></div>
    <div class="label player-name" id="player-name">Diamond_Demonlord</div>
    <div class="label date-label" id="hud-date">04 พ.ย. 2026</div>
    <div class="label time-label" id="hud-time">18:24:36</div>
    <div class="label online-label">Online : <span id="online">128</span>/<span id="maxplayers">500</span></div>
    <div class="label health-label" id="health-text">100%</div>
    <div class="label armour-label" id="armour-text">100%</div>
    <div class="label money-label" id="money">$25,000</div>
    <div class="tiny hunger-label" id="hunger-text">100%</div>
    <div class="tiny thirst-label" id="thirst-text">100%</div>
</main>
<script src="hud.js"></script>
</body></html>
