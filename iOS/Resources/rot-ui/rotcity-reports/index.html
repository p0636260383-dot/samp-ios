<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROT CITY • Oxlyn Reports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      --bg: #0a0d14;
      --panel: #101521;
      --card: #151c2c;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #10b981;
      --blue: #38bdf8;
      --warn: #fbbf24;
      --red: #f87171;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; font-family: 'Noto Sans Thai', 'Sora', sans-serif;
      color: var(--text); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .hidden { display: none !important; }

    #app {
      width: 1040px; max-width: 96vw; height: 640px; max-height: 92vh;
      background: linear-gradient(155deg, #0b0f19 0%, #111827 100%);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 18px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.85);
      display: flex; overflow: hidden;
      animation: popIn 0.18s ease-out;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .sb {
      width: 225px; flex-shrink: 0;
      background: rgba(7, 10, 17, 0.96);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 16px 12px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 6px 14px; border-bottom: 1px solid var(--border); margin-bottom: 12px;
    }
    .brand-ic {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(16, 185, 129, 0.18); border: 1px solid rgba(16, 185, 129, 0.45);
      color: var(--accent); display: grid; place-items: center; font-size: 16px;
    }
    .brand h2 { margin: 0; font-size: 15px; }
    .brand small { color: var(--accent); font-size: 10.5px; font-weight: 700; letter-spacing: 1px; }

    .nav { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .nav-btn {
      min-height: 38px; padding: 8px 12px; border-radius: 10px;
      border: 1px solid transparent; background: transparent; color: var(--muted);
      font-family: inherit; font-size: 13px; font-weight: 600; text-align: left;
      cursor: pointer; display: flex; align-items: center; gap: 10px;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .nav-btn.active {
      background: rgba(16, 185, 129, 0.16); border-color: rgba(16, 185, 129, 0.4); color: #fff;
    }
    .nav-btn.active i { color: var(--accent); }

    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      height: 56px; padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border); background: rgba(15, 23, 42, 0.55);
    }
    .topbar h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .btn {
      min-height: 34px; padding: 0 13px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--card); color: #fff; font-family: inherit; font-size: 12.5px;
      font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: linear-gradient(135deg, #059669, #10b981); border: none; color: #03150e; font-weight: 700; }
    .btn.blue { background: rgba(56, 189, 248, 0.18); border-color: rgba(56, 189, 248, 0.45); color: #bae6fd; }
    .btn.danger { background: rgba(239, 68, 68, 0.18); border-color: rgba(239, 68, 68, 0.45); color: #fecaca; }

    .body { flex: 1; padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 15px;
    }
    .inp, .sel, .txt {
      width: 100%; padding: 9px 12px; border-radius: 9px;
      border: 1px solid var(--border); background: #0a0e17;
      color: #fff; font-family: inherit; font-size: 13px; outline: none;
    }
    .inp:focus, .sel:focus, .txt:focus { border-color: var(--accent); }
    .lbl { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 5px; font-weight: 600; }

    .split { display: grid; grid-template-columns: 320px 1fr; gap: 14px; flex: 1; min-height: 0; }
    .tlist { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 490px; }
    .titem {
      padding: 10px 12px; border-radius: 10px; background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border); cursor: pointer;
    }
    .titem.active { border-color: var(--accent); background: rgba(16, 185, 129, 0.10); }
    .titem-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 4px; }
    .badge {
      font-size: 10.5px; padding: 2px 8px; border-radius: 999px; font-weight: 700;
    }
    .st-0 { background: rgba(251, 191, 36, 0.18); color: var(--warn); }
    .st-1 { background: rgba(56, 189, 248, 0.18); color: var(--blue); }
    .st-2 { background: rgba(148, 163, 184, 0.18); color: var(--muted); }

    .chat-box {
      display: flex; flex-direction: column; height: 100%; min-height: 380px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
    }
    .chat-msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin: 10px 0; padding-right: 4px; }
    .msg {
      padding: 8px 11px; border-radius: 10px; background: rgba(10, 14, 23, 0.85);
      border: 1px solid var(--border); font-size: 12.5px;
    }
    .msg.staff { border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.08); }
    .msg-hd { font-size: 11px; color: var(--muted); margin-bottom: 3px; display: flex; justify-content: space-between; }
    .msg.staff .msg-hd b { color: var(--accent); }

    @media (max-width: 820px) {
      #app { flex-direction: column; height: 94vh; }
      .sb { width: 100%; flex-direction: row; align-items: center; padding: 8px 10px; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); }
      .brand { display: none; }
      .nav { flex-direction: row; }
      .split { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app" class="hidden">
    <aside class="sb">
      <div class="brand">
        <div class="brand-ic"><i class="fa-solid fa-flag"></i></div>
        <div>
          <h2>OXLYN REPORTS</h2>
          <small>ROT CITY SUPPORT</small>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-tab="new"><i class="fa-solid fa-plus-circle"></i> แจ้งปัญหาใหม่</button>
        <button class="nav-btn" data-tab="list"><i class="fa-solid fa-ticket"></i> <span id="tab-list-lbl">Ticket ของฉัน</span></button>
      </nav>
    </aside>

    <section class="main">
      <header class="topbar">
        <h3><i class="fa-solid fa-headset" style="color:var(--accent)"></i> <span id="top-title">แจ้งปัญหา / ขอความช่วยเหลือ</span></h3>
        <div style="display:flex;gap:8px">
          <button class="btn blue" id="btn-lang" title="สลับแป้นพิมพ์ไทย/อังกฤษ (หรือกด F2)">แป้น: TH</button>
          <button class="btn" id="btn-refresh"><i class="fa-solid fa-rotate"></i> รีเฟรช</button>
          <button class="btn danger" id="btn-close"><i class="fa-solid fa-xmark"></i> ปิด</button>
        </div>
      </header>

      <!-- TAB: NEW REPORT -->
      <div class="body" id="pane-new">
        <div class="card">
          <h3 style="margin:0 0 8px;font-size:15px">สร้างใบแจ้งปัญหา (Ticket)</h3>
          <label class="lbl">หมวดหมู่ปัญหา</label>
          <select id="rep-cat" class="sel">
            <option value="บั๊ก/ปัญหาเกม">บั๊ก / ปัญหาเกม</option>
            <option value="แจ้งผู้เล่นผิดกฎ">แจ้งผู้เล่นผิดกฎ</option>
            <option value="ขอความช่วยเหลือ">ขอความช่วยเหลือทั่วไป</option>
            <option value="ไอเทม/เติมเงิน">ไอเทม / เติมเงิน</option>
          </select>
          <label class="lbl">หัวข้อ</label>
          <input id="rep-subj" class="inp" type="text" maxlength="80" placeholder="สรุปปัญหาสั้นๆ..." />
          <label class="lbl">รายละเอียด</label>
          <textarea id="rep-desc" class="txt" rows="5" maxlength="220" placeholder="อธิบายเหตุการณ์ สถานที่ หรือชื่อผู้เล่นที่เกี่ยวข้อง..."></textarea>
          <div style="margin-top:14px;display:flex;justify-content:flex-end">
            <button id="btn-submit" class="btn primary"><i class="fa-solid fa-paper-plane"></i> ส่ง Report ถึงแอดมิน</button>
          </div>
        </div>
      </div>

      <!-- TAB: TICKET LIST & CHAT -->
      <div class="body hidden" id="pane-list">
        <div class="split">
          <div class="card" style="padding:12px;display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <b style="font-size:13px">รายการ Report</b>
              <select id="filter-status" class="sel" style="width:auto;padding:4px 8px;font-size:12px">
                <option value="-1">ทั้งหมด</option>
                <option value="0">รอรับเรื่อง</option>
                <option value="1">กำลังดำเนินการ</option>
                <option value="2">ปิดแล้ว</option>
              </select>
            </div>
            <div id="ticket-list" class="tlist"></div>
          </div>

          <div class="chat-box">
            <div id="detail-empty" style="margin:auto;color:var(--muted);font-size:13px">เลือก Ticket ทางซ้ายเพื่อดูรายละเอียดและแชท</div>
            <div id="detail-view" class="hidden" style="display:flex;flex-direction:column;height:100%">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--border)">
                <div>
                  <b id="det-subj" style="font-size:14px"></b>
                  <div id="det-meta" style="font-size:11.5px;color:var(--muted);margin-top:2px"></div>
                </div>
                <div id="staff-bar" class="hidden" style="display:flex;gap:6px;flex-wrap:wrap">
                  <button class="btn blue" onclick="staffAct('claim')">รับเรื่อง</button>
                  <button class="btn" onclick="staffAct('goto')">วาร์ปหา</button>
                  <button class="btn" onclick="staffAct('bring')">ดึงมา</button>
                  <button class="btn" onclick="staffAct('heal')">ฮีล</button>
                  <button class="btn danger" onclick="staffAct('close')">ปิดเคส</button>
                </div>
              </div>
              <div id="chat-msgs" class="chat-msgs"></div>
              <div style="display:flex;gap:8px">
                <input id="reply-inp" class="inp" type="text" maxlength="200" placeholder="พิมพ์ข้อความตอบกลับ..." />
                <button id="btn-reply" class="btn primary"><i class="fa-solid fa-reply"></i> ส่ง</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);
  const cef = window.cef;

  const STATUS_TXT = ['รอรับเรื่อง', 'กำลังดำเนินการ', 'ปิดแล้ว'];
  let isStaff = false;
  let tickets = [];
  let msgs = [];
  let selectedId = 0;
  let thaiIme = true;

  // Kedmanee Thai Keyboard Mapping for SA-MP CEF where Windows IME sends QWERTY
  const KED_N = {
    '`':'_','1':'ๅ','2':'/','3':'-','4':'ภ','5':'ถ','6':'ุ','7':'ึ','8':'ค','9':'ต','0':'จ','-':'ข','=':'ช',
    'q':'ๆ','w':'ไ','e':'ำ','r':'พ','t':'ะ','y':'ั','u':'ี','i':'ร','o':'น','p':'ย','[':'บ',']':'ล','\\':'ฃ',
    'a':'ฟ','s':'ห','d':'ก','f':'ด','g':'เ','h':'้','j':'่','k':'า','l':'ส',';':'ว','\'':'ง',
    'z':'ผ','x':'ป','c':'แ','v':'อ','b':'ิ','n':'ื','m':'ท',',':'ม','.':'ใ','/':'ฝ'
  };
  const KED_S = {
    '~':'%','!':'+','@':'๑','#':'๒','$':'๓','%':'๔','^':'ู','&':'฿','*':'๕','(':'๖',')':'๗','_':'๘','+':'๙',
    'Q':'๐','W':'"','E':'ฎ','R':'ฑ','T':'ธ','Y':'ํ','U':'๊','I':'ณ','O':'ฯ','P':'ญ','{':'ฐ','}':',','|':'ฅ',
    'A':'ฤ','S':'ฆ','D':'ฏ','F':'โ','G':'ฌ','H':'็','J':'๋','K':'ษ','L':'ศ',':':'ซ','"':'.',
    'Z':'(','X':')','C':'ฉ','V':'ฮ','B':'ฺ','N':'์','M':'?','<':'ฒ','>':'ฬ','?':'ฦ'
  };

  function toggleLang() {
    thaiIme = !thaiIme;
    $('#btn-lang').textContent = thaiIme ? 'แป้น: TH' : 'แป้น: EN';
  }
  $('#btn-lang').onclick = toggleLang;

  function decodeWinChar(c) {
    if (c >= 0x0410 && c <= 0x044F) {
      const b = c - 0x0410 + 0xC0;
      if (b >= 0xA1 && b <= 0xFB) return String.fromCharCode(0x0E00 + (b - 0xA0));
    }
    if (c === 0x040E) return String.fromCharCode(0x0E01);
    if (c === 0x00A7) return String.fromCharCode(0x0E07);
    if (c >= 0x00A1 && c <= 0x00FB && !(c >= 0xDB && c <= 0xDE)) {
      return String.fromCharCode(0x0E00 + (c - 0xA0));
    }
    return null;
  }

  function attachThaiInput(el) {
    if (!el) return;
    el.addEventListener('beforeinput', (e) => {
      if (!e.data || e.inputType !== 'insertText') return;
      let mapped = '', changed = false;
      for (let i = 0; i < e.data.length; i++) {
        const ch = e.data[i];
        const dc = decodeWinChar(ch.charCodeAt(0));
        if (dc) { mapped += dc; changed = true; continue; }
        if (thaiIme && KED_N[ch] !== undefined) { mapped += KED_N[ch]; changed = true; continue; }
        if (thaiIme && KED_S[ch] !== undefined) { mapped += KED_S[ch]; changed = true; continue; }
        mapped += ch;
      }
      if (changed) {
        e.preventDefault();
        const s = el.selectionStart || 0, end = el.selectionEnd || 0;
        el.value = el.value.slice(0, s) + mapped + el.value.slice(end);
        el.selectionStart = el.selectionEnd = s + mapped.length;
      }
    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'F2') { e.preventDefault(); toggleLang(); }
    });
    el.addEventListener('input', () => {
      let changed = false, out = '';
      for (let i = 0; i < el.value.length; i++) {
        const dc = decodeWinChar(el.value.charCodeAt(i));
        if (dc) { out += dc; changed = true; }
        else out += el.value[i];
      }
      if (changed) el.value = out;
    });
  }
  attachThaiInput($('#rep-subj'));
  attachThaiInput($('#rep-desc'));
  attachThaiInput($('#reply-inp'));

  function decodeText(str) {
    if (!str) return '';
    if (str.includes('%')) {
      const b = [];
      for (let i = 0; i < str.length; i++) {
        if (str[i] === '%' && i + 2 < str.length) {
          const v = parseInt(str.slice(i + 1, i + 3), 16);
          if (!isNaN(v)) { b.push(v); i += 2; continue; }
        }
        b.push(str.charCodeAt(i) & 0xFF);
      }
      return new TextDecoder('utf-8', { fatal: false }).decode(new Uint8Array(b));
    }
    return str;
  }

  function emit(ev, val) {
    if (cef && typeof cef.emit === 'function') cef.emit(ev, String(val !== undefined ? val : '1'));
  }

  function switchTab(tab) {
    $$('.nav-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
    $('#pane-new').classList.toggle('hidden', tab !== 'new');
    $('#pane-list').classList.toggle('hidden', tab !== 'list');
    $('#top-title').textContent = tab === 'new' ? 'แจ้งปัญหา / ขอความช่วยเหลือ' : (isStaff ? 'จัดการ Report ทั้งหมด (แอดมิน)' : 'Ticket ของฉัน');
  }

  function renderTickets() {
    const f = parseInt($('#filter-status').value, 10);
    const box = $('#ticket-list');
    box.innerHTML = '';
    const filtered = tickets.filter((t) => f === -1 || t.status === f);
    if (!filtered.length) {
      box.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:12px">ไม่มีรายการ Report</div>';
      return;
    }
    filtered.forEach((t) => {
      const el = document.createElement('div');
      el.className = 'titem' + (t.id === selectedId ? ' active' : '');
      el.innerHTML = `
        <div class="titem-top">
          <b style="font-size:12.5px">#${t.id} ${t.subj}</b>
          <span class="badge st-${t.status}">${STATUS_TXT[t.status] || 'เปิด'}</span>
        </div>
        <div style="font-size:11px;color:var(--muted)">${t.cat} • ${t.reporter}</div>
      `;
      el.onclick = () => {
        selectedId = t.id;
        renderTickets();
        emit('rotrep.openTicket', t.id);
      };
      box.appendChild(el);
    });
  }

  function renderDetail() {
    const t = tickets.find((x) => x.id === selectedId);
    if (!t) {
      $('#detail-empty').classList.remove('hidden');
      $('#detail-view').classList.add('hidden');
      return;
    }
    $('#detail-empty').classList.add('hidden');
    $('#detail-view').classList.remove('hidden');
    $('#det-subj').textContent = `#${t.id} ${t.subj}`;
    $('#det-meta').textContent = `${t.cat} • ผู้แจ้ง: ${t.reporter} • สถานะ: ${STATUS_TXT[t.status]}${t.claimed ? ' (ผู้รับเรื่อง: ' + t.claimed + ')' : ''}`;
    $('#staff-bar').classList.toggle('hidden', !isStaff);

    const mBox = $('#chat-msgs');
    mBox.innerHTML = '';
    msgs.forEach((m) => {
      const d = document.createElement('div');
      d.className = 'msg' + (m.staff ? ' staff' : '');
      d.innerHTML = `<div class="msg-hd"><b>${m.sender}${m.staff ? ' [STAFF]' : ''}</b></div><div></div>`;
      d.querySelectorAll('div')[1].textContent = m.text;
      mBox.appendChild(d);
    });
    mBox.scrollTop = mBox.scrollHeight;
  }

  $$('.nav-btn').forEach((b) => { b.onclick = () => switchTab(b.dataset.tab); });
  $('#filter-status').onchange = renderTickets;
  $('#btn-close').onclick = () => emit('rotrep.close', '1');
  $('#btn-refresh').onclick = () => emit('rotrep.refresh', '1');

  $('#btn-submit').onclick = () => {
    const cat = $('#rep-cat').value;
    const subj = $('#rep-subj').value.trim();
    const desc = $('#rep-desc').value.trim();
    if (!subj || !desc) return;
    const payload = `${encodeURIComponent(cat)}|${encodeURIComponent(subj)}|${encodeURIComponent(desc)}`;
    emit('rotrep.create', payload);
    $('#rep-subj').value = '';
    $('#rep-desc').value = '';
    switchTab('list');
  };

  $('#btn-reply').onclick = () => {
    const txt = $('#reply-inp').value.trim();
    if (!txt || !selectedId) return;
    emit('rotrep.reply', `${selectedId}|${encodeURIComponent(txt)}`);
    $('#reply-inp').value = '';
  };

  window.staffAct = (act) => {
    if (!selectedId) return;
    emit('rotrep.staff', `${act}|${selectedId}`);
  };

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('#app').classList.contains('hidden')) emit('rotrep.close', '1');
  });

  if (cef && typeof cef.on === 'function') {
    cef.on('rotrep.open', (staffFlag, openTab) => {
      isStaff = !!Number(staffFlag);
      $('#tab-list-lbl').textContent = isStaff ? 'จัดการ Report ทั้งหมด' : 'Ticket ของฉัน';
      $('#app').classList.remove('hidden');
      switchTab(openTab === 'list' ? 'list' : 'new');
    });
    cef.on('rotrep.close', () => $('#app').classList.add('hidden'));
    cef.on('rotrep.clear', () => { tickets = []; });
    cef.on('rotrep.item', (id, cat, subj, reporter, status, claimed) => {
      tickets.push({
        id: +id,
        cat: decodeText(cat),
        subj: decodeText(subj),
        reporter: decodeText(reporter),
        status: +status,
        claimed: decodeText(claimed),
      });
    });
    cef.on('rotrep.end', () => { renderTickets(); renderDetail(); });
    cef.on('rotrep.mclear', () => { msgs = []; });
    cef.on('rotrep.mitem', (sender, isStf, text) => {
      msgs.push({ sender: decodeText(sender), staff: !!Number(isStf), text: decodeText(text) });
    });
    cef.on('rotrep.mend', () => { renderDetail(); });
    emit('rotrep.ready', '1');
  }
