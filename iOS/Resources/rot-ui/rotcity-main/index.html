<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ROT CITY - ศูนย์บริการ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="header">
    <h1>🟦 ROT CITY Service Hub</h1>
    <button id="btn-close" class="close-btn">✖</button>
  </div>

  <div class="menu-grid">
    <div class="menu-item" id="open-shop">
      <img src="../rotcity-shared/assets/icons/shop.png" alt="Shop" />
      <span>ร้านค้า</span>
    </div>
    <div class="menu-item" id="open-market">
      <img src="../rotcity-shared/assets/icons/market.png" alt="Market" />
      <span>ตลาด</span>
    </div>
    <div class="menu-item" id="open-trade">
      <img src="../rotcity-shared/assets/icons/trade.png" alt="Trade" />
      <span>เทรด</span>
    </div>
    <div class="menu-item" id="open-exchange">
      <img src="../rotcity-shared/assets/icons/exchange.png" alt="Exchange" />
      <span>แลกเปลี่ยน</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
