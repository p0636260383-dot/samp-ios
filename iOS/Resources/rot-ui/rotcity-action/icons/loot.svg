<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 92" width="92" height="92">
  <defs>
    <linearGradient id="lootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="60%" stop-color="#0066ee"/>
      <stop offset="100%" stop-color="#001855"/>
    </linearGradient>
    <filter id="lootGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#0088ff" flood-opacity="0.85"/>
