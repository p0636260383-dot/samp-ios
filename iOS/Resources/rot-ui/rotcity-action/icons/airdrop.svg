<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 92" width="92" height="92">
  <defs>
    <linearGradient id="airdropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#0077ff"/>
      <stop offset="100%" stop-color="#002277"/>
    </linearGradient>
    <filter id="airdropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#0088ff" flood-opacity="0.85"/>
    </filter>
  </defs>
  <g filter="url(#airdropGlow)">
    <!-- Parachute Dome -->
    <path d="M 20 38 C 20 18, 72 18, 72 38 C 64 34, 56 34, 46 36 C 36 34, 28 34, 20 38 Z" fill="url(#airdropGrad)" stroke="#00ffff" stroke-width="1.2"/>
    <!-- Parachute Lines -->
    <line x1="20" y1="38" x2="38" y2="54" stroke="#00ffff" stroke-width="1" opacity="0.7"/>
    <line x1="36" y1="36" x2="42" y2="54" stroke="#00ffff" stroke-width="1" opacity="0.7"/>
    <line x1="56" y1="36" x2="50" y2="54" stroke="#00ffff" stroke-width="1" opacity="0.7"/>
    <line x1="72" y1="38" x2="54" y2="54" stroke="#00ffff" stroke-width="1" opacity="0.7"/>
    <!-- Supply Crate -->
    <rect x="36" y="54" width="20" height="20" rx="3" fill="#081826" stroke="#00ffff" stroke-width="1.5"/>
    <!-- Straps & Biohazard / Cross on crate -->
    <line x1="46" y1="54" x2="46" y2="74" stroke="#00ffff" stroke-width="1"/>
    <line x1="36" y1="64" x2="56" y2="64" stroke="#00ffff" stroke-width="1"/>
    <circle cx="46" cy="64" r="3" fill="#ff334b"/>
  </g>
</svg>