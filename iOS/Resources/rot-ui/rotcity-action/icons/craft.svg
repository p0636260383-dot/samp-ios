<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 92" width="92" height="92">
  <defs>
    <linearGradient id="craftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="60%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#001166"/>
    </linearGradient>
    <filter id="craftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#00aaff" flood-opacity="0.8"/>
    </filter>
  </defs>
  <g filter="url(#craftGlow)">
    <!-- Cogwheel -->
    <circle cx="46" cy="46" r="22" fill="none" stroke="url(#craftGrad)" stroke-width="4.5" stroke-dasharray="8,5"/>
    <circle cx="46" cy="46" r="14" fill="#081420" stroke="#00ffff" stroke-width="1.5"/>
    <!-- Hammer -->
    <rect x="43" y="24" width="6" height="38" rx="2" fill="#00e5ff" transform="rotate(-30, 46, 46)"/>
    <rect x="36" y="22" width="20" height="10" rx="2" fill="url(#craftGrad)" stroke="#ffffff" stroke-width="1" transform="rotate(-30, 46, 46)"/>
    <!-- Center Dot -->
    <circle cx="46" cy="46" r="4" fill="#00ffff"/>
  </g>
</svg>