<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 92" width="92" height="92">
  <defs>
    <linearGradient id="gunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="60%" stop-color="#0066ee"/>
      <stop offset="100%" stop-color="#002277"/>
    </linearGradient>
    <filter id="gunGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#0088ff" flood-opacity="0.85"/>
    </filter>
  </defs>
  <g filter="url(#gunGlow)">
    <!-- Pistol / Rifle Silhouette -->
    <path d="M 18 36 L 68 36 L 68 46 L 56 46 L 52 64 L 42 62 L 46 46 L 24 46 L 18 42 Z" fill="url(#gunGrad)" stroke="#00ffff" stroke-width="1.2"/>
    <!-- Barrel vent -->
    <line x1="22" y1="39" x2="36" y2="39" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
    <!-- Trigger guard -->
    <path d="M 46 46 C 46 54, 38 54, 38 46" stroke="#00ffff" stroke-width="1.5" fill="none"/>
    <line x1="42" y1="46" x2="41" y2="50" stroke="#00ffff" stroke-width="1.5"/>
    <!-- Crosshair / Sight Accent -->
    <circle cx="68" cy="32" r="10" stroke="#00e5ff" stroke-width="1.2" stroke-dasharray="3,2" fill="none"/>
    <line x1="68" y1="18" x2="68" y2="46" stroke="#00e5ff" stroke-width="1"/>
    <line x1="54" y1="32" x2="82" y2="32" stroke="#00e5ff" stroke-width="1"/>
  </g>
</svg>