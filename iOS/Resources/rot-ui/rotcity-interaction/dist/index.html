<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OXLYN Interaction • ROT CITY</title>
<link rel="stylesheet" href="../fontawesome/css/all.min.css" />
<link rel="stylesheet" href="../fontawesome/css/fa-pro-compat.css" />
<style>
  :root {
    --ox-acc: #38bdf8;
    --ox-bg: rgba(11, 16, 26, 0.88);
    --ox-text: #f8fafc;
    --ox-scale: 1;
  }
  * { box-sizing: border-box; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: transparent !important;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: var(--ox-text);
    pointer-events: none;
  }
  .hidden { display: none !important; }

  /* Prompt Anchors */
  #prompt-wrap {
    position: fixed; z-index: 20;
    left: 50%; bottom: 13%; transform: translateX(-50%) scale(var(--ox-scale));
    transition: all 0.16s ease;
    pointer-events: auto; cursor: pointer;
  }
  #prompt-wrap.pos-left   { left: 28px; top: 50%; bottom: auto; transform: translateY(-50%) scale(var(--ox-scale)); }
  #prompt-wrap.pos-right  { left: auto; right: 28px; top: 50%; bottom: auto; transform: translateY(-50%) scale(var(--ox-scale)); }
  #prompt-wrap.pos-top    { left: 50%; top: 10%; bottom: auto; transform: translateX(-50%) scale(var(--ox-scale)); }
  #prompt-wrap.pos-bottom { left: 50%; bottom: 13%; top: auto; transform: translateX(-50%) scale(var(--ox-scale)); }

  /* Core Prompt Box */
  .oxp {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 14px; border-radius: 10px;
    background: var(--ox-bg);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 10px 28px rgba(0,0,0,0.55);
    color: var(--ox-text); font-size: 13.5px; font-weight: 600;
    animation: oxIn 0.16s ease-out;
  }
  @keyframes oxIn { from { opacity: 0; transform: translateY(6px) scale(0.95); } to { opacity: 1; transform: none; } }

  .oxp-key {
    min-width: 28px; height: 28px; padding: 0 7px; border-radius: 7px;
    background: #fff; color: #090d16; font-weight: 800; font-size: 13px;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 0 rgba(0,0,0,0.35);
  }
  .oxp-ic { color: var(--ox-acc); font-size: 14px; }
  .oxp-lbl { white-space: nowrap; }
  .oxp-sub { font-size: 11px; color: #94a3b8; margin-left: 4px; }

  /* 26 Style Variants */
  .oxp.st-pill { border-radius: 999px; padding: 7px 16px 7px 8px; }
  .oxp.st-pill .oxp-key { border-radius: 999px; background: var(--ox-acc); color: #04121f; }
  .oxp.st-card { padding: 10px 14px; border-left: 3px solid var(--ox-acc); border-radius: 10px; }
  .oxp.st-minimal { background: transparent; border: none; border-bottom: 1.5px solid var(--ox-acc); border-radius: 0; box-shadow: none; padding: 4px 8px; }
  .oxp.st-neon { border: 1.5px solid var(--ox-acc); box-shadow: 0 0 18px var(--ox-acc); }
  .oxp.st-neon .oxp-key { background: var(--ox-acc); color: #04121f; }
  .oxp.st-island { background: #05070c; border-radius: 999px; border-color: rgba(255,255,255,0.08); }
  .oxp.st-ring .oxp-key { border-radius: 50%; background: transparent; color: #fff; border: 2px solid var(--ox-acc); }
  .oxp.st-dot { border-radius: 999px; }
  .oxp.st-dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ox-acc); box-shadow: 0 0 8px var(--ox-acc); }
  .oxp.st-orbit .oxp-key { border-radius: 50%; border: 2px dashed var(--ox-acc); background: rgba(56,189,248,0.15); color: #fff; }
  .oxp.st-glass { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.28); }
  .oxp.st-outline { background: rgba(0,0,0,0.28); border: 1.5px solid rgba(255,255,255,0.45); }
  .oxp.st-tag { border-radius: 6px; border-right: 4px solid var(--ox-acc); }
  .oxp.st-bubble { border-radius: 16px 16px 16px 4px; border-color: var(--ox-acc); }
  .oxp.st-stack { flex-direction: column; gap: 4px; padding: 10px 16px; text-align: center; }
  .oxp.st-line { border-radius: 4px; border-left: 4px solid var(--ox-acc); }
  .oxp.st-chip { padding: 5px 11px; border-radius: 8px; font-size: 12.5px; }
  .oxp.st-gradient { background: linear-gradient(135deg, rgba(15,23,42,0.95), var(--ox-acc)); border: none; }
  .oxp.st-solid { background: var(--ox-acc); color: #04121f; border: none; }
  .oxp.st-solid .oxp-ic, .oxp.st-solid .oxp-sub { color: #04121f; }
  .oxp.st-solid .oxp-key { background: #04121f; color: #fff; }
  .oxp.st-arrow { border-radius: 8px; }
  .oxp.st-bracket { background: rgba(8,12,20,0.68); border: none; border-left: 2px solid var(--ox-acc); border-right: 2px solid var(--ox-acc); border-radius: 2px; }
  .oxp.st-split { padding: 0 14px 0 0; overflow: hidden; }
  .oxp.st-split .oxp-key { height: 38px; border-radius: 0; background: var(--ox-acc); color: #04121f; padding: 0 12px; }
  .oxp.st-ghost { background: transparent; border: none; box-shadow: none; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
  .oxp.st-badge { border-radius: 999px; background: rgba(15,23,42,0.95); border: 1px solid var(--ox-acc); }
  .oxp.st-signal .oxp-key { border-radius: 50%; box-shadow: 0 0 0 4px rgba(56,189,248,0.25); }
  .oxp.st-wave { border-bottom: 2px solid var(--ox-acc); border-radius: 12px; }
  .oxp.st-float { box-shadow: 0 16px 36px rgba(0,0,0,0.72), 0 0 16px rgba(56,189,248,0.22); }

  /* Editor Modal */
  #editor-bg {
    position: fixed; inset: 0; background: rgba(4, 7, 14, 0.55);
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; z-index: 40;
  }
  .ed-box {
    width: 740px; max-width: 94vw; max-height: 88vh;
    background: #0d1320; border: 1px solid rgba(56,189,248,0.35);
    border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 28px 80px rgba(0,0,0,0.85);
  }
  .ed-hd { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
  .ed-hd h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .ed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 7px; max-height: 250px; overflow-y: auto; padding: 2px; }
  .st-btn {
    padding: 8px 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
    background: #141c2e; color: #cbd5e1; font-size: 12px; font-weight: 600; cursor: pointer;
    text-transform: capitalize; font-family: inherit;
  }
  .st-btn.active { border-color: var(--ox-acc); background: rgba(56,189,248,0.18); color: #fff; }
  .ed-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .ed-sel, .ed-inp {
    background: #141c2e; border: 1px solid rgba(255,255,255,0.16); color: #fff;
    border-radius: 8px; padding: 6px 10px; font-family: inherit; font-size: 12.5px;
  }
  .ed-ft { display: flex; justify-content: flex-end; gap: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
  .btn {
    padding: 8px 14px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.16);
    background: #182135; color: #fff; font-weight: 600; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .btn.save { background: var(--ox-acc); color: #04121f; border: none; font-weight: 700; }
  .btn.close { background: rgba(239,68,68,0.18); border-color: rgba(239,68,68,0.45); color: #fecaca; }
</style>
</head>
<body>
  <div id="prompt-wrap" class="pos-bottom hidden" onclick="triggerPrompt()">
    <div id="prompt-box" class="oxp st-keycap">
      <span id="p-key" class="oxp-key">N</span>
      <i id="p-ic" class="oxp-ic fa-solid fa-hand-pointer"></i>
      <span id="p-lbl" class="oxp-lbl">โต้ตอบ</span>
      <span id="p-sub" class="oxp-sub"></span>
    </div>
  </div>

  <div id="editor-bg" class="hidden">
    <div class="ed-box">
      <div class="ed-hd">
        <h3><i class="fa-solid fa-wand-magic-sparkles" style="color:var(--ox-acc)"></i> ปรับแต่ง Oxlyn Interaction (26 สไตล์)</h3>
        <button class="btn close" onclick="closeEditor()">✕ ปิด</button>
      </div>
      <div style="font-size:12px;color:#94a3b8">เลือกสไตล์ปุ่มแจ้งเตือน:</div>
      <div id="style-grid" class="ed-grid"></div>
      <div class="ed-row">
        <label>สีหลัก: <input id="ed-color" type="color" value="#38bdf8" style="vertical-align:middle" /></label>
        <label>ตำแหน่ง:
          <select id="ed-pos" class="ed-sel">
            <option value="bottom">ด้านล่างกลาง</option>
            <option value="left">ด้านซ้ายกลาง</option>
            <option value="right">ด้านขวากลาง</option>
            <option value="top">ด้านบนกลาง</option>
          </select>
        </label>
        <label>ขนาด: <input id="ed-scale" type="range" min="0.8" max="1.4" step="0.05" value="1" /></label>
      </div>
      <div class="ed-ft">
        <button class="btn" onclick="resetEditor()">รีเซ็ต</button>
        <button class="btn save" onclick="saveEditor()">บันทึกการตั้งค่า</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const cef = window.cef;

  const STYLES = [
    'keycap','pill','card','minimal','neon','island','ring','dot','orbit','glass',
    'outline','tag','bubble','stack','line','chip','gradient','solid','arrow','bracket',
    'split','ghost','badge','signal','wave','float'
  ];

  let cfg = { style: 'keycap', color: '#38bdf8', pos: 'bottom', scale: 1.0 };
  let activePrompt = null;

  function decodeText(str) {
    if (!str) return '';
    if (str.includes('%')) {
      const b = [];
      for (let i = 0; i < str.length; i++) {
        if (str[i] === '%' && i + 2 < str.length) {
          const v = parseInt(str.slice(i + 1, i + 3), 16);
          if (!isNaN(v)) { b.push(v); i += 2; continue; }
        }
        b.push(str.charCodeAt(i) & 0xFF);
      }
      return new TextDecoder('utf-8', { fatal: false }).decode(new Uint8Array(b));
    }
    return str;
  }

  function applyCfg() {
    document.documentElement.style.setProperty('--ox-acc', cfg.color || '#38bdf8');
    document.documentElement.style.setProperty('--ox-scale', cfg.scale || 1);
    const wrap = $('#prompt-wrap');
    wrap.classList.remove('pos-bottom', 'pos-left', 'pos-right', 'pos-top');
    wrap.classList.add('pos-' + (cfg.pos || 'bottom'));
    const box = $('#prompt-box');
    box.className = 'oxp st-' + (cfg.style || 'keycap');
    $('#ed-color').value = cfg.color || '#38bdf8';
    $('#ed-pos').value = cfg.pos || 'bottom';
    $('#ed-scale').value = String(cfg.scale || 1);
    document.querySelectorAll('.st-btn').forEach((b) => b.classList.toggle('active', b.dataset.st === cfg.style));
  }

  function buildGrid() {
    const g = $('#style-grid');
    g.innerHTML = '';
    STYLES.forEach((st) => {
      const b = document.createElement('button');
      b.className = 'st-btn' + (st === cfg.style ? ' active' : '');
      b.dataset.st = st;
      b.textContent = st;
      b.onclick = () => { cfg.style = st; applyCfg(); };
      g.appendChild(b);
    });
  }

  function emit(ev, val) {
    if (cef && typeof cef.emit === 'function') cef.emit(ev, String(val !== undefined ? val : '1'));
  }

  window.triggerPrompt = () => {
    if (activePrompt) emit('roti.trigger', activePrompt.type);
  };
  window.closeEditor = () => {
    $('#editor-bg').classList.add('hidden');
    if (!activePrompt) $('#prompt-wrap').classList.add('hidden');
    emit('roti.close', '1');
  };
  window.resetEditor = () => {
    cfg = { style: 'keycap', color: '#38bdf8', pos: 'bottom', scale: 1.0 };
    applyCfg();
  };
  window.saveEditor = () => {
    emit('roti.save', `${cfg.style}|${cfg.color}|${cfg.pos}|${cfg.scale}`);
    window.closeEditor();
  };

  $('#ed-color').oninput = (e) => { cfg.color = e.target.value; applyCfg(); };
  $('#ed-pos').onchange = (e) => { cfg.pos = e.target.value; applyCfg(); };
  $('#ed-scale').oninput = (e) => { cfg.scale = parseFloat(e.target.value) || 1; applyCfg(); };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('#editor-bg').classList.contains('hidden')) window.closeEditor();
  });

  buildGrid();
  applyCfg();

  if (cef && typeof cef.on === 'function') {
    cef.on('roti.show', (show, type, key, label, sub, icon) => {
      if (!Number(show)) {
        activePrompt = null;
        if ($('#editor-bg').classList.contains('hidden')) $('#prompt-wrap').classList.add('hidden');
        return;
      }
      activePrompt = { type: String(type || '') };
      $('#p-key').textContent = decodeText(key || 'N');
      $('#p-lbl').textContent = decodeText(label || 'โต้ตอบ');
      $('#p-sub').textContent = decodeText(sub || '');
      $('#p-ic').className = 'oxp-ic ' + (icon || 'fa-solid fa-hand-pointer');
      $('#prompt-wrap').classList.remove('hidden');
    });
    cef.on('roti.cfg', (st, col, pos, sc) => {
      cfg = { style: st || 'keycap', color: col || '#38bdf8', pos: pos || 'bottom', scale: parseFloat(sc) || 1.0 };
      applyCfg();
    });
    cef.on('roti.editor', (open) => {
      if (Number(open)) {
        $('#editor-bg').classList.remove('hidden');
        if (!activePrompt) {
          $('#p-key').textContent = 'N';
          $('#p-lbl').textContent = 'พรีวิวปุ่มโต้ตอบ (กด N)';
          $('#p-sub').textContent = '';
          $('#prompt-wrap').classList.remove('hidden');
        }
      } else {
        $('#editor-bg').classList.add('hidden');
        if (!activePrompt) $('#prompt-wrap').classList.add('hidden');
      }
    });
    emit('roti.ready', '1');
  }
})();
</script>
</body>
</html>
