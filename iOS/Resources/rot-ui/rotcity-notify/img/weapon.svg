<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gunMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#455a64"/>
      <stop offset="40%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#102027"/>
    </linearGradient>
    <linearGradient id="gunGrip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
  </defs>
  <filter id="gunShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
  </filter>
  <g filter="url(#gunShadow)">
    <!-- Barrel & Body -->
    <path d="M 12 36 L 82 36 L 84 38 L 84 46 L 76 48 L 72 48 L 68 56 L 62 56 L 64 48 L 44 48 L 40 50 L 36 68 L 26 66 L 32 48 L 12 48 Z" fill="url(#gunMetal)"/>
    <!-- Stock / Grip -->
    <path d="M 38 50 L 34 68 L 25 66 L 30 48 Z" fill="url(#gunGrip)"/>
    <!-- Magazine -->
    <path d="M 52 48 L 56 66 L 48 68 L 45 48 Z" fill="#212121"/>
    <!-- Sight -->
    <rect x="78" y="32" width="3" height="4" fill="#37474f"/>
    <rect x="22" y="33" width="6" height="3" fill="#37474f"/>
    <!-- Highlight barrel -->
    <line x1="14" y1="38" x2="80" y2="38" stroke="#78909c" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>