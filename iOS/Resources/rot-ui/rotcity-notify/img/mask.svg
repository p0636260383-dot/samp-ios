<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="50%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#102027"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00695c"/>
    </linearGradient>
  </defs>
  <filter id="maskShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
  </filter>
  <g filter="url(#maskShadow)">
    <!-- Mask Body -->
    <path d="M 28 35 C 28 20, 72 20, 72 35 C 76 50, 70 75, 50 82 C 30 75, 24 50, 28 35 Z" fill="url(#maskGrad)"/>
    <!-- Eye Lenses -->
    <circle cx="39" cy="40" r="11" fill="#1b282e" stroke="#455a64" stroke-width="2"/>
    <circle cx="39" cy="40" r="8" fill="url(#lensGrad)" opacity="0.85"/>
    <circle cx="61" cy="40" r="11" fill="#1b282e" stroke="#455a64" stroke-width="2"/>
    <circle cx="61" cy="40" r="8" fill="url(#lensGrad)" opacity="0.85"/>
    <!-- Filter Canister (Bottom Center) -->
    <ellipse cx="50" cy="65" rx="13" ry="11" fill="#455a64"/>
    <ellipse cx="50" cy="65" rx="9" ry="7" fill="#212121"/>
    <circle cx="50" cy="65" r="3" fill="#607d8b"/>
  </g>
</svg>