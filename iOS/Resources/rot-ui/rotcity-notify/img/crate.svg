<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="crateMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#455a64"/>
      <stop offset="50%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="crateAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0091ea"/>
    </linearGradient>
  </defs>
  <filter id="crateShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
  </filter>
  <g filter="url(#crateShadow)">
    <!-- Box Body -->
    <rect x="20" y="24" width="60" height="54" rx="4" fill="url(#crateMetal)" stroke="#546e7a" stroke-width="2"/>
    <!-- Metal Bands -->
    <rect x="20" y="32" width="60" height="6" fill="#1c252a"/>
    <rect x="20" y="60" width="60" height="6" fill="#1c252a"/>
    <!-- Cyber Lock Light -->
    <rect x="44" y="44" width="12" height="12" rx="2" fill="url(#crateAccent)"/>
    <circle cx="50" cy="50" r="2" fill="#fff"/>
  </g>
</svg>