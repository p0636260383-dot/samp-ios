<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="flareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffea00"/>
      <stop offset="60%" stop-color="#ff3d00"/>
      <stop offset="100%" stop-color="#ff1744"/>
    </linearGradient>
  </defs>
  <filter id="flareShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ff1744" flood-opacity="0.6"/>
  </filter>
  <g filter="url(#flareShadow)">
    <!-- Tube -->
    <rect x="42" y="38" width="16" height="48" rx="3" fill="url(#flareGrad)"/>
    <rect x="40" y="44" width="20" height="6" fill="#fff" opacity="0.9"/>
    <rect x="40" y="70" width="20" height="6" fill="#fff" opacity="0.9"/>
    <!-- Flame / Spark on top -->
    <path d="M 50 12 C 42 22 40 32 44 38 L 56 38 C 60 32 58 22 50 12 Z" fill="url(#fireGrad)"/>
    <circle cx="50" cy="30" r="5" fill="#fff"/>
  </g>
</svg>