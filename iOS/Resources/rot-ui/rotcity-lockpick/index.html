<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROT CITY - งัดท้ายรถ</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; font-family: 'Segoe UI', Tahoma, sans-serif;
    display: flex; align-items: center; justify-content: center;
    color: #e2e8f0;
  }
  .panel {
    width: 440px; max-width: 92vw;
    background: rgba(10, 18, 30, 0.94);
    border: 1px solid rgba(56, 189, 248, 0.45);
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75), 0 0 25px rgba(56, 189, 248, 0.15);
    padding: 20px 22px;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    padding-bottom: 10px;
  }
  .title { font-size: 16px; font-weight: 700; color: #38bdf8; letter-spacing: 0.4px; }
  .close-btn {
    background: rgba(239, 68, 68, 0.18); color: #fca5a5;
    border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 8px;
    width: 30px; height: 30px; cursor: pointer; font-weight: 700;
  }
  .pins {
    display: flex; gap: 10px; justify-content: center; margin: 12px 0 16px;
  }
  .pin {
    flex: 1; text-align: center; padding: 8px 6px; border-radius: 8px;
    background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(148, 163, 184, 0.25);
    font-size: 12px; font-weight: 600; color: #94a3b8;
  }
  .pin.active { border-color: #38bdf8; color: #38bdf8; background: rgba(56, 189, 248, 0.12); }
  .pin.done { border-color: #22c55e; color: #4ade80; background: rgba(34, 197, 94, 0.16); }
  .pin.fail { border-color: #ef4444; color: #f87171; background: rgba(239, 68, 68, 0.18); }

  .track {
    position: relative; height: 36px; width: 100%;
    background: #0f172a; border-radius: 10px;
    border: 1px solid rgba(148, 163, 184, 0.35);
    overflow: hidden; margin-bottom: 16px;
  }
  .sweet-spot {
    position: absolute; top: 0; height: 100%;
    background: linear-gradient(180deg, rgba(34, 197, 94, 0.55), rgba(22, 163, 74, 0.75));
    border-left: 2px solid #86efac; border-right: 2px solid #86efac;
  }
  .needle {
    position: absolute; top: 0; width: 6px; height: 100%;
    background: #facc15; box-shadow: 0 0 10px #facc15;
    transform: translateX(-50%);
  }
  .status {
    text-align: center; font-size: 13px; min-height: 20px;
    margin-bottom: 14px; color: #cbd5e1;
  }
  .pry-btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #0284c7, #2563eb);
    color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
  }
  .pry-btn:active { transform: scale(0.98); }
  .pry-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .hint { text-align: center; font-size: 11px; color: #64748b; margin-top: 10px; }
</style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <div class="title">งัดท้ายรถด้วยชะแลง</div>
      <button class="close-btn" id="closeBtn">X</button>
    </div>
    <div class="pins">
      <div class="pin active" id="pin0">สลัก 1</div>
      <div class="pin" id="pin1">สลัก 2</div>
      <div class="pin" id="pin2">สลัก 3</div>
    </div>
    <div class="track" id="track">
      <div class="sweet-spot" id="spot"></div>
      <div class="needle" id="needle"></div>
    </div>
    <div class="status" id="status">กด SPACE หรือปุ่มด้านล่างให้ตรงแถบสีเขียว!</div>
    <button class="pry-btn" id="pryBtn">งัดสลัก! (SPACE)</button>
    <div class="hint">หากงัดพลาด ชะแลงจะหักพังทันที • กด ESC เพื่อยกเลิก</div>
  </div>

<script>
(() => {
  const spotEl = document.getElementById('spot');
  const needleEl = document.getElementById('needle');
  const statusEl = document.getElementById('status');
  const pryBtn = document.getElementById('pryBtn');
  const closeBtn = document.getElementById('closeBtn');

  let stage = 0;
  let pos = 5;
  let dir = 1;
  let speed = 1.35;
  let spotStart = 40;
  let spotWidth = 18;
  let finished = false;

  function emitResult(code) {
    if (typeof cef !== 'undefined' && cef && typeof cef.emit === 'function') {
      cef.emit('rottrunk.lockpick', String(code));
    }
  }

  function setupStage(s) {
    stage = s;
    spotWidth = s === 0 ? 20 : s === 1 ? 16 : 13;
    speed = s === 0 ? 1.35 : s === 1 ? 1.75 : 2.15;
    spotStart = 12 + Math.floor(Math.random() * (76 - spotWidth));
    spotEl.style.left = spotStart + '%';
    spotEl.style.width = spotWidth + '%';
    for (let i = 0; i < 3; i++) {
      const p = document.getElementById('pin' + i);
      p.className = 'pin' + (i < s ? ' done' : i === s ? ' active' : '');
    }
  }

  function tick() {
    if (finished) return;
    pos += dir * speed;
    if (pos >= 98) { pos = 98; dir = -1; }
    else if (pos <= 2) { pos = 2; dir = 1; }
    needleEl.style.left = pos + '%';
    requestAnimationFrame(tick);
  }

  function attempt() {
    if (finished) return;
    const hit = pos >= spotStart - 1.2 && pos <= (spotStart + spotWidth + 1.2);
    if (hit) {
      if (stage >= 2) {
        finished = true;
        pryBtn.disabled = true;
        document.getElementById('pin2').className = 'pin done';
        statusEl.style.color = '#4ade80';
        statusEl.textContent = 'งัดสำเร็จ! กำลังเปิดท้ายรถ...';
        setTimeout(() => emitResult(1), 450);
      } else {
        statusEl.style.color = '#38bdf8';
        statusEl.textContent = 'ปลดสลัก ' + (stage + 1) + ' สำเร็จ! เหลืออีก ' + (2 - stage) + ' สลัก';
        setupStage(stage + 1);
      }
    } else {
      finished = true;
      pryBtn.disabled = true;
      document.getElementById('pin' + stage).className = 'pin fail';
      statusEl.style.color = '#f87171';
      statusEl.textContent = 'งัดพลาด! ชะแลงหักพังแล้ว!';
      setTimeout(() => emitResult(0), 650);
    }
  }

  pryBtn.addEventListener('click', attempt);
  closeBtn.addEventListener('click', () => {
    if (finished) return;
    finished = true;
    emitResult(2);
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); attempt(); }
    else if (e.code === 'Escape') {
      if (!finished) { finished = true; emitResult(2); }
    }
  });

  setupStage(0);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
